name: Build PySide6 Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android NDK & Fix SDKManager Path
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install PySide6 Tools
      run: |
        # Global install taaki venv project ke andar na bane
        pip install PySide6==6.8.0 buildozer cython requests

    - name: Download Official Qt Android Wheels
      run: |
        wget -q https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        wget -q https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl

    # 🔥 FIX: Manually delete extra folders to bypass the buggy --extra-ignore-dirs flag
    - name: Cleanup Workspace for Build
      run: |
        rm -rf venv .git .github requirements.txt
        ls -la # Verifying only main.py and Main.qml remain

    - name: Deploy APK (PySide6 to Android)
      run: |
        # 1. Mode ko 'release' kiya (Debug symbols hatane ke liye)
        # 2. --extra-modules me sirf wahi rakha jo zaroori hai
        pyside6-android-deploy \
          -f \
          --name="HelloQt" \
          --mode=release \
          --wheel-pyside=PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl \
          --wheel-shiboken=shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl \
          --ndk-path=$ANDROID_NDK_ROOT \
          --sdk-path=$ANDROID_HOME \
          --extra-modules=Core,Gui,Quick,Qml,Network,Widgets

    - name: Prepare APK for Upload
      if: always()
      run: |
        mkdir -p release
        find . -name "*.apk" -exec cp {} release/ \;
        ls -la release/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HelloQt-Android-APK
        path: release/*.apk
