name: Build PySide6 Android APK (Optimized)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android NDK & Fix SDKManager Path
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install PySide6 Tools
      run: |
        pip install PySide6==6.8.0 buildozer cython requests

    - name: Download and Perform "Wheel Surgery" (Size Reduction)
    # Is step me hum wheel ke andar se 50-60MB ka kachra nikal denge
      run: |
        # 1. Download Wheels
        wget -q https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        wget -q https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        
        # 2. Extract PySide6 Wheel
        unzip -q PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl -d ps6_temp
        
        # 3. DELETE HEAVY UNUSED C++ LIBRARIES (The Surgery)
        # Hum sirf Core, Gui, Qml, Quick, aur Network rakhenge. Baaki sab uda denge.
        cd ps6_temp/PySide6/Qt/lib/
        rm -v libQt6Widgets.so libQt6Sql.so libQt6Xml.so libQt6Pdf.so libQt6OpenGL.so libQt6OpenGLWidgets.so libQt6PrintSupport.so libQt6Test.so libQt6Concurrent.so || true
        cd ../../../..
        
        # 4. Repack the Slim Wheel
        cd ps6_temp
        zip -rq ../PySide6-Slim.whl .
        cd ..
        
        # 5. Cleanup
        rm -rf ps6_temp venv .git .github requirements.txt

    - name: Deploy APK (PySide6 to Android)
      run: |
        # Ab hum 'Slim Wheel' ka use kar rahe hain
        pyside6-android-deploy \
          -f \
          --name="HelloQt" \
          --wheel-pyside=PySide6-Slim.whl \
          --wheel-shiboken=shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl \
          --ndk-path=$ANDROID_NDK_ROOT \
          --sdk-path=$ANDROID_HOME

    - name: Prepare APK for Upload
      if: always()
      run: |
        mkdir -p release
        find . -name "*.apk" -exec cp {} release/ \;
        ls -la release/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HelloQt-Optimized-APK
        path: release/*.apk
