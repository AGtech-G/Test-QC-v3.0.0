name: Build PySide6 Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android NDK and Set Strip Path
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "STRIP_TOOL=$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install PySide6 Tools
      run: |
        pip install PySide6==6.8.0 buildozer cython requests

    - name: Surgery PySide6 Wheel
      run: |
        wget -q https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        unzip -q PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl -d ps6_temp
        cd ps6_temp/PySide6/Qt/
        cd qml/
        find . -maxdepth 1 -type d ! -name '.' ! -name 'QtQuick' ! -name 'Qt' ! -name 'QtCore' ! -name 'QtQml' ! -name 'QtGraphicalEffects' -exec rm -rf {} + || true
        cd ..
        rm -rf translations/ plugins/ designer/ doc/ examples/ || true
        cd lib/
        rm -rf libQt6Multimedia* libQt6WebEngine* libQt63D* libQt6Bluetooth* libQt6Positioning* libQt6Sensors* libQt6Nfc* libQt6Pdf* libQt6Charts* libQt6DataVisualization* libQt6Sql* libQt6Xml* libQt6Svg* libQt6Test* || true
        find . -name "*.so" -exec $STRIP_TOOL --strip-unneeded {} \;
        cd ../../../..
        rm PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        cd ps6_temp && zip -rq ../PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl . && cd ..
        rm -rf ps6_temp

    - name: Surgery Shiboken Wheel
      run: |
        wget -q https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        unzip -q shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl -d sh_temp
        cd sh_temp
        find . -name "*.so" -exec $STRIP_TOOL --strip-unneeded {} \;
        cd ..
        rm shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        cd sh_temp && zip -rq ../shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl . && cd ..
        rm -rf sh_temp

    - name: Deploy APK
      run: |
        pyside6-android-deploy \
          -f \
          --name="QuickCode" \
          --wheel-pyside=PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl \
          --wheel-shiboken=shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl \
          --ndk-path=$ANDROID_NDK_ROOT \
          --sdk-path=$ANDROID_HOME

    - name: Prepare APK for Upload
      if: always()
      run: |
        mkdir -p release
        find . -name "*.apk" -exec cp {} release/ \;
        ls -lh release/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuickCode-Optimized-APK
        path: release/*.apk
