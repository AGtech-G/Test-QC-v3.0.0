name: Build PySide6 Android APK (Nuclear Optimized)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android NDK & Set Strip Path
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "STRIP_TOOL=$ANDROID_HOME/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" >> $GITHUB_ENV
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install PySide6 Tools
      run: |
        pip install PySide6==6.8.0 buildozer cython requests

    - name: ☢️ NUCLEAR WHEEL SURGERY (Deep Clean)
      run: |
        # 1. Download Wheels
        wget -q https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        wget -q https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        
        # 2. Extract PySide6
        unzip -q PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl -d ps6_temp
        cd ps6_temp/PySide6/Qt/
        
        # --- NUCLEAR CLEANING ---
        # 2.1 Delete all language translations (Saves ~15MB)
        rm -rf translations/
        
        # 2.2 Delete useless plugins (Saves ~10MB)
        rm -rf plugins/position plugins/sqldrivers plugins/sensors plugins/multimedia plugins/texttospeech plugins/canvas || true
        
        # 2.3 Delete heavy unused C++ libs
        cd lib/
        rm -rf libQt6Multimedia* libQt6WebEngine* libQt63D* libQt6Bluetooth* libQt6Positioning* libQt6Sensors* libQt6Nfc* libQt6Pdf* libQt6SpatialAudio* libQt6VirtualKeyboard* libQt6Charts* libQt6DataVisualization* libQt6Sql* libQt6Xml* || true
        
        # 2.4 STRIP ALL REMAINING BINARIES (Max Compacting)
        find . -name "*.so" -exec $STRIP_TOOL --strip-unneeded {} \;
        cd ../../../..
        
        # 3. Strip Shiboken
        unzip -q shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl -d sh_temp
        cd sh_temp
        find . -name "*.so" -exec $STRIP_TOOL --strip-unneeded {} \;
        cd ..
        
        # 4. Repack Wheels
        rm *.whl
        cd ps6_temp && zip -rq ../PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl . && cd ..
        cd sh_temp && zip -rq ../shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl . && cd ..
        
        # 5. Final Cleanup
        rm -rf ps6_temp sh_temp venv .git .github requirements.txt

    - name: Deploy APK (PySide6 to Android)
      run: |
        pyside6-android-deploy \
          -f \
          --name="QuickCode" \
          --wheel-pyside=PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl \
          --wheel-shiboken=shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl \
          --ndk-path=$ANDROID_NDK_ROOT \
          --sdk-path=$ANDROID_HOME

    - name: Prepare APK for Upload
      if: always()
      run: |
        mkdir -p release
        find . -name "*.apk" -exec cp {} release/ \;
        ls -lh release/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QuickCode-Nuclear-Optimized
        path: release/*.apk
