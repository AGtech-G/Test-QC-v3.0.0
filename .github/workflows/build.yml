name: Build PySide6 Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # FIX 1: Install Ubuntu System Dependencies required by Buildozer
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android NDK & Fix SDKManager Path
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        
        # FIX 2: Create a shortcut (symlink) so Buildozer finds sdkmanager where it expects it!
        mkdir -p $ANDROID_HOME/tools/bin
        ln -s $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/tools/bin/sdkmanager
        # Accept all Android licenses to prevent build stops
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Install Dependencies in Virtual Environment
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt

    - name: Download Official Qt Android Wheels
      run: |
        wget -q https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl
        wget -q https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl

    - name: Deploy APK (PySide6 to Android)
      run: |
        source venv/bin/activate
        pyside6-android-deploy \
          -f \
          --name="HelloQt" \
          --wheel-pyside=PySide6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl \
          --wheel-shiboken=shiboken6-6.8.0-6.8.0-cp311-cp311-android_aarch64.whl \
          --ndk-path=$ANDROID_NDK_ROOT \
          --sdk-path=$ANDROID_HOME

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HelloQt-Android-APK
        path: '**/*.apk'
