name: Build PySide6 Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Button se manually run karne ke liye

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Android NDK
      run: |
        # PySide6 Android ke liye usually NDK 25 lagta hai
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

    - name: Install PySide6
      run: |
        pip install -r requirements.txt

    - name: Deploy APK (PySide6 to Android)
      run: |
        # Ye Qt ka official deployer hai (Buildozer ki jagah)
        pyside6-android-deploy \
          --name="HelloQt" \
          --ndk-path=$ANDROID_NDK_ROOT \
          --sdk-path=$ANDROID_HOME \
          --jdk-path=$JAVA_HOME \
          --app-local-path=. \
          --main-file=main.py

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HelloQt-Android-APK
        path: android-build/build/outputs/apk/debug/*.apk
